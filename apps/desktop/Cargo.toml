[package]
name = "poe2-desktop"
version.workspace = true
edition.workspace = true
publish = false
default-run = "poe2-toolkit"

[[bin]]
name = "poe2-toolkit"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
poe2-core.workspace = true
poe2-service.workspace = true
anyhow.workspace = true
chrono.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
raw-window-handle = "0.6.2"
tray-icon = { version = "=0.25.1", default-features = false }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-resource = "=3.0.11"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_Graphics_Gdi"] }

winreg = "=0.55.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSGraphics", "NSVisualEffectView", "NSWorkspace", "NSAccessibility"] }
