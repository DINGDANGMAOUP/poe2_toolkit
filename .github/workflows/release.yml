name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: application-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag and source
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 .github/scripts/publish.py validate
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified CI artifacts for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/artifacts.py --output dist/release
      - name: Sign, publish, and advance update feed
        env:
          GH_TOKEN: ${{ github.token }}
          APP_UPDATE_SIGNING_KEY: ${{ secrets.APP_UPDATE_SIGNING_KEY }}
        run: python3 .github/scripts/publish.py publish --artifacts dist/release
